name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: cross-compile both architectures
        run: |
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/harness
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/harness

  generated:
    # The vendor copies are generated, so a hand-edit that skips the generator
    # would silently ship two different constitutions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: constitution copies match their source
        run: |
          diff -u shared/AGENTS.md claude/CLAUDE.md
          diff -u shared/AGENTS.md antigravity/GEMINI.md

      - name: derived agy agents are up to date
        run: |
          go build -o /tmp/harness ./cmd/harness
          for f in claude/agents/*.md; do
            /tmp/harness derive "$f" "/tmp/$(basename "$f")"
            diff -u "antigravity/plugins/harness/agents/$(basename "$f")" "/tmp/$(basename "$f")"
          done

  install:
    # A dry-run install against a scratch HOME, then a real one, then doctor.
    # This is the check that would have caught a hook naming a script that was
    # never deployed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: dry run changes nothing
        run: |
          mkdir -p /tmp/fakehome
          go run ./cmd/harness install --dry-run --home /tmp/fakehome
          test -z "$(ls -A /tmp/fakehome)" || { echo "dry run wrote files"; exit 1; }

      - name: install then doctor
        run: |
          go run ./cmd/harness install --home /tmp/fakehome
          go run ./cmd/harness doctor --home /tmp/fakehome

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r shellcheck
